<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - JazzCash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="jazzcash-storage.js"></script>
    <style>
        :root{--red:#e60000;--black:#111;--bg:#f4f5f7;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a}
        *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}body{background:#121212;display:flex;justify-content:center;align-items:center;width:100vw;height:100vh;overflow:hidden}
        .phone{width:100%;max-width:390px;height:100%;max-height:800px;background:var(--bg);position:relative;overflow-y:auto;box-shadow:0 10px 30px #0008}@media(min-width:400px){.phone{height:90vh;border:8px solid #2b2b2b;border-radius:36px}}
        .top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--black);color:#fff;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:2}.top-left{display:flex;align-items:center;gap:10px}.top h1{font-size:16px}.back{width:32px;height:32px;border:0;border-radius:50%;background:#292929;color:#fff;cursor:pointer}
        .content{padding:16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.summary-card small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.summary-card strong{font-size:16px}.summary-card.received strong{color:var(--green)}.summary-card.sent strong{color:var(--red)}
        .statement-head{display:flex;justify-content:space-between;align-items:center;margin:5px 0 10px}.statement-head strong{font-size:14px}.statement-head span{font-size:10px;color:var(--muted)}.entry{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}.entry-top{display:flex;gap:10px;align-items:center}.entry-icon{width:35px;height:35px;border-radius:11px;background:#fef2f2;color:var(--red);display:flex;align-items:center;justify-content:center}.entry-icon.received{background:#f0fdf4;color:var(--green)}.entry-main{min-width:0;flex:1}.entry-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-date{font-size:10px;color:var(--muted);margin-top:4px}.amount{font-size:13px;font-weight:700}.amount.sent{color:var(--red)}.amount.received{color:var(--green)}.entry-actions{display:flex;gap:8px;margin:10px 0 0 45px}.action{border:1px solid var(--line);border-radius:15px;background:#fff;padding:6px 10px;font-size:10px;cursor:pointer}.empty{background:#fff;border:1px dashed var(--line);border-radius:15px;text-align:center;color:var(--muted);font-size:12px;padding:30px 16px}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center;z-index:4}.modal.show{display:flex}.modal-card{width:100%;max-width:390px;background:#fff;border-radius:22px 22px 0 0;padding:20px}.modal-card h2{font-size:16px;margin-bottom:14px}.modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12px}.modal-row span:first-child{color:var(--muted)}
    </style>
</head>
<body>
<main class="phone">
    <header class="top"><div class="top-left"><button class="back" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button><h1>Transaction History</h1></div><i class="fa-solid fa-house" onclick="window.location.href='index.html'" style="cursor:pointer"></i></header>
    <div class="content"><div class="summary"><div class="summary-card received"><small>Received</small><strong id="received">Rs. 0.00</strong></div><div class="summary-card sent"><small>Sent</small><strong id="sent">Rs. 0.00</strong></div></div><div class="statement-head"><strong>Account Statement</strong><span id="count">0 transactions</span></div><div id="list"></div></div>
</main>
<div class="modal" id="receipt-modal" onclick="if(event.target===this)closeReceipt()"><div class="modal-card"><h2>Transaction receipt</h2><div class="modal-row"><span>Title</span><strong id="r-title"></strong></div><div class="modal-row"><span>Amount</span><strong id="r-amount"></strong></div><div class="modal-row"><span>Status</span><strong id="r-status" style="color:var(--green)"></strong></div><div class="modal-row"><span>Date</span><strong id="r-date"></strong></div><div class="modal-row"><span>TID</span><strong id="r-tid"></strong></div><button class="action" style="width:100%;margin-top:16px;padding:12px" onclick="closeReceipt()">Close</button></div></div>
<script>
    function render(){
        const entries=JazzCashStore.getStatements().slice().sort((a,b)=>new Date(b.timestamp||b.date)-new Date(a.timestamp||a.date));
        const received=entries.filter(e=>(e.direction||'Sent')==='Received').reduce((n,e)=>n+Number(e.amount||0),0);const sent=entries.filter(e=>(e.direction||'Sent')!=='Received').reduce((n,e)=>n+Number(e.amount||0),0);
        document.getElementById('received').textContent='Rs. '+JazzCashStore.formatMoney(received);document.getElementById('sent').textContent='Rs. '+JazzCashStore.formatMoney(sent);document.getElementById('count').textContent=entries.length+' transaction'+(entries.length===1?'':'s');
        const list=document.getElementById('list');list.innerHTML='';
        if(!entries.length){list.innerHTML='<div class="empty"><i class="fa-solid fa-receipt" style="font-size:28px;margin-bottom:10px"></i><br>No transactions yet.<br>Completed payments and wallet top-ups will appear here.</div>';return}
        entries.forEach((entry,index)=>{
            const received=(entry.direction||'Sent')==='Received', item=document.createElement('article');item.className='entry';
            item.innerHTML='<div class="entry-top"><div class="entry-icon '+(received?'received':'')+'"><i class="fa-solid '+(received?'fa-arrow-down':'fa-arrow-up')+'"></i></div><div class="entry-main"><div class="entry-title"></div><div class="entry-date"></div></div><div class="amount '+(received?'received':'sent')+'">'+(received?'+':'-')+' Rs. '+JazzCashStore.formatMoney(entry.amount)+'</div></div><div class="entry-actions"><button class="action" data-receipt="'+index+'"><i class="fa-solid fa-receipt"></i> Receipt</button>'+(!received?'<button class="action" data-repeat="'+index+'"><i class="fa-solid fa-repeat"></i> Repeat</button>':'')+'</div>';
            item.querySelector('.entry-title').textContent=entry.title||'JazzCash Transaction';item.querySelector('.entry-date').textContent=(entry.date||'')+' · '+(entry.status||'Successful');
            item.querySelector('[data-receipt]').onclick=()=>openReceipt(entry);const repeat=item.querySelector('[data-repeat]');if(repeat)repeat.onclick=()=>repeatTransaction(entry);list.appendChild(item)
        })
    }
    function openReceipt(entry){document.getElementById('r-title').textContent=entry.title||'JazzCash Transaction';document.getElementById('r-amount').textContent='Rs. '+JazzCashStore.formatMoney(entry.amount);document.getElementById('r-status').textContent=entry.status||'Successful';document.getElementById('r-date').textContent=entry.date||'';document.getElementById('r-tid').textContent=entry.tid||'';document.getElementById('receipt-modal').classList.add('show')}
    function closeReceipt(){document.getElementById('receipt-modal').classList.remove('show')}
    function repeatTransaction(entry){const detail=entry.detail||'';alert('Repeat '+entry.title+' for '+(detail||'the saved recipient')+' from the Load & Packages or Bill Payment screen.');}
    window.addEventListener('storage',render);window.addEventListener('jazzcash:statement',render);render();
</script>
</body>
</html>
