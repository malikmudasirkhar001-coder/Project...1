<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transaction History - JazzCash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f1012; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .decimal-sup { font-size: 0.65em; vertical-align: super; margin-left: 1px; font-weight: 600; }
    
    /* Loader */
    #loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .dots-container { display: flex; gap: 10px; }
    .dot-loader { width: 16px; height: 16px; background-color: #facc15; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out both; }
    .dot-loader:nth-child(1) { animation-delay: -0.36s; } .dot-loader:nth-child(2) { animation-delay: -0.24s; } .dot-loader:nth-child(3) { animation-delay: -0.12s; } .dot-loader:nth-child(4) { animation-delay: 0s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-[430px] min-h-screen sm:min-h-[880px] bg-white sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border border-gray-200">
    
    <div id="loader-overlay">
        <div class="dots-container">
            <div class="dot-loader"></div><div class="dot-loader"></div><div class="dot-loader"></div><div class="dot-loader"></div>
        </div>
    </div>

    <div class="w-full pt-3 pb-1 px-6 flex justify-between items-center text-xs text-gray-700 bg-white font-medium">
      <span>7:01</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3C7.03 3 2.84 5.48.43 9.27L12 23.36l11.57-14.09C21.16 5.48 16.97 3 12 3z"/></svg>
        <span class="text-[10px] font-bold">4G</span>
        <svg class="w-4 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
        <svg class="w-5 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4z"/></svg>
      </div>
    </div>

    <header class="px-5 py-3 flex items-center justify-between border-b border-gray-100 bg-white">
      <button class="p-1 -ml-1 text-gray-800" onclick="window.location.href='index.html'">
        <svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path></svg>
      </button>
      <h1 class="text-base font-bold text-gray-800 tracking-tight">Transaction History</h1>
      <div class="w-6"></div>
    </header>

    <div class="grid grid-cols-2 bg-gray-50 border-b border-gray-200">
      <button id="tab-all" class="py-3.5 text-center text-[15px] font-semibold text-gray-900 border-b-2 border-black" onclick="filterTransactions('all')">All Payments</button>
      <button id="tab-spending" class="py-3.5 text-center text-[15px] font-medium text-gray-400" onclick="filterTransactions('spending')">Spending</button>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar px-4 pt-4 pb-8 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-[#f2f7f4] border border-emerald-100 rounded-xl p-3 flex items-center space-x-3">
          <div class="w-9 h-9 rounded-lg bg-emerald-100 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-emerald-600 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 4.5l-15 15m0 0h11.25m-11.25 0V8.25"></path></svg>
          </div>
          <div><span class="text-xs text-gray-500 block">Received</span><div class="text-[15px] font-bold text-gray-900" id="total-received">Rs. 0<span class="decimal-sup">.00</span></div></div>
        </div>
        <div class="bg-[#fdf2f2] border border-red-100 rounded-xl p-3 flex items-center space-x-3">
          <div class="w-9 h-9 rounded-lg bg-red-100 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-red-500 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"></path></svg>
          </div>
          <div><span class="text-xs text-gray-500 block">Sent</span><div class="text-[15px] font-bold text-gray-900" id="total-sent">Rs. 0<span class="decimal-sup">.00</span></div></div>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <div>
          <div class="text-[13px] font-semibold text-gray-800" id="transaction-count">Last 0 transactions</div>
        </div>
      </div>
      <div class="border-t border-gray-100 my-1"></div>

      <div id="transactions-container" class="space-y-4"></div>
    </div>

    <div class="w-full py-2 flex justify-center items-center bg-white border-t border-gray-100"><div class="w-32 h-1 bg-gray-300 rounded-full"></div></div>
  </div>

  <script>
    function formatCurrency(amount) { return Number(amount || 0).toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function formatStatementDate(dateValue) {
        const date = new Date(dateValue || Date.now());
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${date.getDate()} ${months[date.getMonth()]}, ${date.getFullYear()}`;
    }

    let allTransactions = [];
    let currentFilter = 'all';

    function loadTransactions() {
        try { allTransactions = JSON.parse(localStorage.getItem('jazzcash_transactions') || '[]'); } catch (error) { allTransactions = []; }
        renderUI();
    }

    function renderUI() {
        let filtered = currentFilter === 'spending' ? allTransactions.filter(t => t.direction === 'out') : allTransactions;
        let totalIn = 0, totalOut = 0;
        allTransactions.forEach(t => { if (t.direction === 'in') totalIn += Number(t.amount); else totalOut += Number(t.amount); });

        document.getElementById('total-received').innerHTML = `Rs. ${formatCurrency(totalIn).split('.')[0]}<span class="decimal-sup">.${formatCurrency(totalIn).split('.')[1] || '00'}</span>`;
        document.getElementById('total-sent').innerHTML = `Rs. ${formatCurrency(totalOut).split('.')[0]}<span class="decimal-sup">.${formatCurrency(totalOut).split('.')[1] || '00'}</span>`;
        document.getElementById('transaction-count').innerText = `Last ${filtered.length} transactions`;

        const container = document.getElementById('transactions-container');
        container.innerHTML = '';
        if (filtered.length === 0) { container.innerHTML = `<div class="text-center text-gray-500 py-10">No transactions found.</div>`; return; }

        let currentDateGroup = '';
        filtered.forEach((item, index) => {
            const dateGroup = formatStatementDate(item.date);
            if (dateGroup !== currentDateGroup) {
                currentDateGroup = dateGroup;
                container.innerHTML += `<section class="space-y-3 pt-2"><div class="text-[11px] font-medium text-gray-400">${dateGroup}</div>`;
            }

            const isReceived = item.direction === 'in';
            const arrowColor = isReceived ? 'text-emerald-600' : 'text-red-500';
            const arrowPath = isReceived ? "M19.5 4.5l-15 15m0 0h11.25m-11.25 0V8.25" : "M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25";
            const amountPrefix = isReceived ? '+' : '-';

            container.innerHTML += `
                <div class="flex items-start justify-between py-1 border-b border-gray-100 pb-3">
                    <div class="flex items-start space-x-3">
                        <div class="mt-1 ${arrowColor}"><svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${arrowPath}"></path></svg></div>
                        <div>
                            <p class="text-xs text-gray-500">${item.type}</p>
                            <p class="text-sm font-bold text-gray-900">${amountPrefix} Rs. ${formatCurrency(item.amount)}</p>
                            <p class="text-[11px] text-gray-400">${item.recipient || item.detail}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end space-y-1.5">
                        ${!isReceived ? `<button onclick="triggerAction(${index}, 'repeat')" class="w-[78px] flex items-center justify-center space-x-1 px-2 py-0.5 rounded-full border border-gray-300 text-[11px]"><i class="fa-solid fa-rotate-right text-gray-500"></i> <span>Repeat</span></button>` : ''}
                        <button onclick="triggerAction(${index}, 'view')" class="w-[78px] flex items-center justify-center space-x-1 px-2 py-0.5 rounded-full border border-gray-300 text-[11px]"><i class="fa-regular fa-file-lines text-gray-500"></i> <span>Receipt</span></button>
                    </div>
                </div>
            `;

            if (index === filtered.length - 1 || formatStatementDate(filtered[index + 1].date) !== currentDateGroup) { container.innerHTML += `</section>`; }
        });
    }

    function filterTransactions(filter) {
        currentFilter = filter;
        document.getElementById('tab-all').className = filter === 'all' ? "py-3.5 text-center text-[15px] font-semibold text-gray-900 border-b-2 border-black" : "py-3.5 text-center text-[15px] font-medium text-gray-400";
        document.getElementById('tab-spending').className = filter === 'spending' ? "py-3.5 text-center text-[15px] font-semibold text-gray-900 border-b-2 border-black" : "py-3.5 text-center text-[15px] font-medium text-gray-400";
        showLoader(() => renderUI());
    }

    function showLoader(callback) {
        const loader = document.getElementById('loader-overlay');
        loader.style.display = 'flex';
        setTimeout(() => { loader.style.display = 'none'; if (callback) callback(); }, 1500);
    }

    function triggerAction(index, action) {
        showLoader(() => {
            const item = allTransactions[index];
            localStorage.setItem('jazzcash_action_data', JSON.stringify(item));
            window.location.href = `index.html?action=${action}`;
        });
    }

    window.onload = () => { loadTransactions(); };
  </script>
</body>
</html>
